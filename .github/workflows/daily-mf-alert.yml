name: Daily MF DMA Alerts

on:
  schedule:
    # Run every day at 02:30 UTC (08:00 IST)
    - cron: '30 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python/telegram_bot/requirements.txt

      - name: Download Latest Database
        run: |
          LATEST_URL=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r '.assets[] | select(.name=="funds.db.zst") | .browser_download_url')
          curl -L $LATEST_URL -o funds.db.zst
          python -c '
          import zstandard as zstd
          import shutil
          dctx = zstd.ZstdDecompressor()
          with open("funds.db.zst", "rb") as ifh, open("funds.db", "wb") as ofh:
              dctx.copy_stream(ifh, ofh)
          '

      - name: Send Daily Alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python python/telegram_bot/send_daily.py
