services:

  ollama:
    container_name: ollama
    image: ollama/ollama:latest
    ports:
      - '11434:11434'
    volumes:
      - ~/.ollama:/root/.ollama

  postgres:
    image: postgres:18-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: dailynav
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: dailynav-app
    ports:
      - '18080:8080'
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DAILY_NAV_DATABASE_TYPE=postgres
      - DAILY_NAV_URL=jdbc:postgresql://postgres:5432/dailynav
      - DAILY_NAV_USERNAME=postgres
      - DAILY_NAV_PASSWORD=postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: